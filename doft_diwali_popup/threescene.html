<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}#c{display:block}</style></head>
<body><canvas id="c" width="2400" height="1650"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const P=new URLSearchParams(location.search);
const OPT=P.get('opt')||'B';
const VIEW=P.get('view')||'hero';
const FT=0.3048, K=8*FT, HALF=K/2;
const col={ivory:0xEFE4CE, ivory2:0xE7DAC0, marble:0xF4F0E8, brass:0xCBA24A, mauve:0x4A343A, glow:0xF6DFAF,
  glass:0xFCFAF6, box:0xB89A6E, flower:0x8A7A5E, screen:0x2b2230};

const R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
R.setSize(2400,1650,false); R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputColorSpace=THREE.SRGBColorSpace; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;

const scene=new THREE.Scene();
// background gradient
(function(){const c=document.createElement('canvas');c.width=16;c.height=512;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,512);
 g.addColorStop(0,'#FBF7EE');g.addColorStop(0.55,'#F1E9DA');g.addColorStop(1,'#E4D8C4');x.fillStyle=g;x.fillRect(0,0,16,512);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;scene.background=t;})();
// studio env (bright band -> crisp metal/marble reflections)
(function(){const pm=new THREE.PMREMGenerator(R);const c=document.createElement('canvas');c.width=8;c.height=256;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#fffdf7');g.addColorStop(0.34,'#f3ecdd');g.addColorStop(0.4,'#ffffff');g.addColorStop(0.46,'#f0e7d6');g.addColorStop(1,'#c7b89f');
 x.fillStyle=g;x.fillRect(0,0,8,256);const tex=new THREE.CanvasTexture(c);tex.mapping=THREE.EquirectangularReflectionMapping;
 scene.environment=pm.fromEquirectangular(tex).texture;})();

// marble texture (soft veining)
function marbleTex(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
 x.fillStyle='#F4F0E8';x.fillRect(0,0,512,512);x.strokeStyle='rgba(150,140,125,0.25)';
 for(let i=0;i<18;i++){x.lineWidth=Math.random()*1.6+0.3;x.beginPath();let px=Math.random()*512,py=0;x.moveTo(px,py);
  while(py<512){px+=(Math.random()-0.5)*60;py+=30;x.lineTo(px,py);}x.stroke();}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

const M={
 ivory:new THREE.MeshStandardMaterial({color:col.ivory,roughness:0.42,metalness:0.0,envMapIntensity:0.85}),
 ivory2:new THREE.MeshStandardMaterial({color:col.ivory2,roughness:0.5,metalness:0.0,envMapIntensity:0.7}),
 marble:new THREE.MeshStandardMaterial({color:col.marble,map:marbleTex(),roughness:0.12,metalness:0.0,envMapIntensity:1.15}),
 brass:new THREE.MeshStandardMaterial({color:col.brass,roughness:0.26,metalness:1.0,envMapIntensity:1.25}),
 mauve:new THREE.MeshStandardMaterial({color:col.mauve,roughness:0.5,metalness:0.05,envMapIntensity:0.5}),
 glow:new THREE.MeshStandardMaterial({color:col.glow,emissive:col.glow,emissiveIntensity:1.5,roughness:1}),
 glass:new THREE.MeshStandardMaterial({color:col.glass,roughness:0.16,metalness:0,transparent:true,opacity:0.9,emissive:0xFFF0D6,emissiveIntensity:0.22,envMapIntensity:1.1}),
 box:new THREE.MeshStandardMaterial({color:col.box,roughness:0.8,metalness:0}),
 flame:new THREE.MeshBasicMaterial({color:0xFFC661}),
 screen:new THREE.MeshStandardMaterial({color:col.screen,roughness:0.3,metalness:0.2,emissive:0x24506a,emissiveIntensity:0.25})
};
function box(w,h,d,m,x,y,z,cast=true){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);me.castShadow=cast;me.receiveShadow=true;scene.add(me);return me;}
function glowSprite(x,y,z,size,op){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d').createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,226,160,'+op+')');g.addColorStop(1,'rgba(255,226,160,0)');const cx=c.getContext('2d');cx.fillStyle=g;cx.fillRect(0,0,128,128);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));
 sp.position.set(x,y,z);sp.scale.set(size,size,1);scene.add(sp);}

// lights
scene.add(new THREE.HemisphereLight(0xfff6e8,0x9c8f7e,0.5));
const key=new THREE.DirectionalLight(0xfff1db,2.1);key.position.set(3.4,5.4,3.2);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.bias=-0.0004;key.shadow.radius=3;
Object.assign(key.shadow.camera,{left:-3.2,right:3.2,top:3.8,bottom:-1.2,near:0.5,far:18});scene.add(key);
const fillL=new THREE.DirectionalLight(0xffe9cf,0.45);fillL.position.set(-3.5,2.6,2.2);scene.add(fillL);
const rim=new THREE.DirectionalLight(0xffe6c4,0.6);rim.position.set(-1.5,3,-4);scene.add(rim);

// floor (polished, subtle reflection via low roughness + env)
box(40,0.02,40,new THREE.MeshStandardMaterial({color:0xEDE6D8,roughness:0.55,metalness:0.0,envMapIntensity:0.5}),0,-0.01,0,false);
const rug=new THREE.Mesh(new THREE.CircleGeometry(2.5,48),new THREE.MeshStandardMaterial({color:0xE6DAC6,roughness:0.9}));
rug.rotation.x=-Math.PI/2;rug.position.y=0.004;rug.receiveShadow=true;scene.add(rug);

function textTex(txt,fg,sp){const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');
 x.clearRect(0,0,1024,256);x.fillStyle=fg;x.font='700 150px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.letterSpacing=(sp||40)+'px';x.fillText(txt,512,140);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}

// candle
function candle(x,y,z,s){s=s||1;const g=new THREE.Mesh(new THREE.CylinderGeometry(0.05*s,0.048*s,0.13*s,24),M.glass);
 g.position.set(x,y+0.065*s,z);g.castShadow=true;scene.add(g);
 const b=new THREE.Mesh(new THREE.CylinderGeometry(0.051*s,0.051*s,0.018*s,24),M.brass);b.position.set(x,y+0.05*s,z);scene.add(b);
 const f=new THREE.Mesh(new THREE.SphereGeometry(0.012*s,10,10),M.flame);f.position.set(x,y+0.15*s,z);f.scale.y=1.8;scene.add(f);}
function flowers(x,y,z){for(let i=0;i<5;i++){const a=(i/5)*6.28;const st=new THREE.Mesh(new THREE.CylinderGeometry(0.004,0.004,0.22,6),new THREE.MeshStandardMaterial({color:col.flower,roughness:1}));
 st.position.set(x+Math.cos(a)*0.03,y+0.11,z+Math.sin(a)*0.03);st.rotation.z=(Math.random()-0.5)*0.4;scene.add(st);
 const bl=new THREE.Mesh(new THREE.SphereGeometry(0.02,8,8),new THREE.MeshStandardMaterial({color:i%2?0xC98F86:0xD9B86B,roughness:0.9}));bl.position.set(st.position.x,y+0.22,st.position.z);scene.add(bl);}
 const v=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.03,0.1,16),M.glass);v.position.set(x,y+0.05,z);scene.add(v);}

// ================= KIOSK =================
box(K,0.12,K,M.ivory2,0,0.06,0);                 // plinth
const cabH=2.05,cabZ=-HALF+0.22;
box(K,cabH,0.42,M.ivory,0,0.12+cabH/2,cabZ);      // back cabinet
box(0.16,cabH*0.92,K*0.6,M.ivory,-HALF+0.08,0.12+cabH*0.46,-0.1); // side wall L
box(0.16,cabH*0.92,K*0.6,M.ivory, HALF-0.08,0.12+cabH*0.46,-0.1); // side wall R
const panW=K-0.5,panH=cabH-0.7,panY=0.12+0.35+panH/2,panZ=cabZ+0.215;
box(panW,panH,0.02,M.glow,0,panY,panZ);           // backlit
glowSprite(0,panY,panZ+0.35,2.4,0.35);
const glP=new THREE.PointLight(0xffd9a0,7,6,2);glP.position.set(0,panY,panZ+0.5);scene.add(glP);
const front=panZ+0.02;

if(OPT==='B'){const cols=3,rows=3,gw=panW*0.98,gh=panH*0.98,x0=-gw/2,y0=panY-gh/2,cw=gw/cols,ch=gh/rows;
 for(let c=0;c<=cols;c++) box(0.04,gh,0.30,M.brass,x0+c*cw,panY,cabZ+0.16);
 for(let r=0;r<=rows;r++) box(gw+0.04,0.04,0.30,M.brass,0,y0+r*ch,cabZ+0.16);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const cx=x0+(c+0.5)*cw,cy=y0+(r+0.5)*ch;candle(cx-0.09,cy-ch/2+0.02,front-0.03,0.95);candle(cx+0.09,cy-ch/2+0.02,front-0.03,0.8);}
}else if(OPT==='A'){const bays=3,bw=panW/bays;
 for(let i=0;i<bays;i++){const cx=-panW/2+(i+0.5)*bw;box(0.06,panH,0.30,M.brass,cx-bw/2,panY,cabZ+0.16);box(0.06,panH,0.30,M.brass,cx+bw/2,panY,cabZ+0.16);
  const a=new THREE.Mesh(new THREE.TorusGeometry(bw*0.44,0.03,12,28,Math.PI),M.brass);a.position.set(cx,panY+panH/2-bw*0.44,cabZ+0.17);scene.add(a);
  box(bw*0.86,0.035,0.28,M.brass,cx,panY-0.05,cabZ+0.15);
  candle(cx,panY-panH/2+0.02,front-0.03,1.05);candle(cx-0.11,panY-0.02,front-0.03,0.9);candle(cx+0.11,panY-0.02,front-0.03,0.9);}
}else{for(let i=0;i<4;i++){const ly=panY-panH/2+0.16+i*(panH/4);box(panW*0.96,0.035,0.26,M.brass,0,ly,cabZ+0.15);
  for(let k=0;k<4;k++) candle(-panW/2+(k+0.6)*(panW/4.6),ly,front-0.04,0.85);}
  box(K+0.5,0.12,K+0.42,M.mauve,0,cabH+0.42,-0.08);box(0.08,0.55,0.08,M.brass,-K/2-0.18,cabH+0.12,HALF-0.2);box(0.08,0.55,0.08,M.brass,K/2+0.18,cabH+0.12,HALF-0.2);
  const pvP=new THREE.PointLight(0xffdca6,3,4,2);pvP.position.set(-0.7,cabH+0.2,0.3);scene.add(pvP);}

// fascia + sign
const fasH=0.4,fasY=0.12+cabH+fasH/2;box(K,fasH,0.46,M.mauve,0,fasY,cabZ+0.02);
const sg=new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.35),new THREE.MeshStandardMaterial({map:textTex('DOFT','#E9CD82',60),emissive:0xE9CD82,emissiveMap:textTex('DOFT','#ffffff',60),emissiveIntensity:1.0,transparent:true}));
sg.position.set(0,fasY,cabZ+0.26);scene.add(sg);glowSprite(0,fasY,cabZ+0.4,1.5,0.18);

// counter + STORAGE
const cnW=1.9,cnH=0.9,cnD=0.6,cnZ=HALF-0.55, cbFront=cnZ+cnD/2, cbBack=cnZ-cnD/2;
box(cnW+0.08,0.06,cnD+0.08,M.marble,0,0.12+cnH+0.03,cnZ);   // marble top (always)
box(cnW+0.02,0.04,cnD+0.02,M.brass,0,0.16,cnZ);             // base trim (always)
box(0.26,0.18,0.02,M.screen,cnW/2-0.3,0.12+cnH+0.14,cnZ+0.08);
candle(-cnW/2+0.3,0.12+cnH+0.06,cnZ-0.05,1.15);flowers(-cnW/2+0.55,0.12+cnH+0.06,cnZ);
function lockHandle(x,y,z){box(0.03,0.14,0.03,M.brass,x,y,z);const lk=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.02,12),M.brass);lk.rotation.x=Math.PI/2;lk.position.set(x,y-0.16,z);scene.add(lk);}
if(VIEW==='storage'){
  // ---- open cutaway counter revealing lockable storage ----
  const t=0.03, midY=0.12+cnH*0.5;
  box(cnW,t,cnD,M.ivory,0,0.12+t/2,cnZ,false);            // bottom
  box(t,cnH,cnD,M.ivory,-cnW/2+t/2,0.12+cnH/2,cnZ);       // left wall
  box(t,cnH,cnD,M.ivory, cnW/2-t/2,0.12+cnH/2,cnZ);       // right wall
  box(cnW,cnH,t,M.ivory,0,0.12+cnH/2,cbBack+t/2);         // back wall
  box(t,cnH,cnD,M.ivory2,0,0.12+cnH/2,cnZ);               // centre divider
  box(cnW-0.1,t,cnD-0.1,M.ivory2,0,midY,cnZ,false);       // mid shelf
  const bx=(x,y,z)=>box(0.26,0.2,0.34,M.box,x,y,z);       // stock boxes
  bx(-0.55,0.12+0.12,cnZ); bx(-0.2,0.12+0.12,cnZ+0.04); bx(-0.35,0.12+0.12,cnZ-0.14);
  bx(0.5,0.12+0.12,cnZ); bx(0.2,0.12+0.12,cnZ-0.05);
  bx(-0.5,midY+0.12,cnZ); bx(0.5,midY+0.12,cnZ); bx(0.15,midY+0.12,cnZ-0.04);
  // left door closed (handle + lock), right door open
  const dw=(cnW-2*t)/2-0.02;
  box(dw,cnH-0.06,t,M.ivory,-cnW/4,0.12+cnH/2,cbFront-0.01);  // closed door
  lockHandle(-0.12,0.12+cnH/2,cbFront+0.02);
  const g=new THREE.Group();g.position.set(cnW/2-t,0.12+cnH/2,cbFront);   // open door, hinged right
  const dp=new THREE.Mesh(new THREE.BoxGeometry(dw,cnH-0.06,t),M.ivory);dp.position.set(-dw/2,0,0);dp.castShadow=true;g.add(dp);
  const hh=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.14,0.03),M.brass);hh.position.set(-dw+0.08,0,0.03);g.add(hh);
  const lk2=new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.02,12),M.brass);lk2.rotation.x=Math.PI/2;lk2.position.set(-dw+0.08,-0.16,0.03);g.add(lk2);
  g.rotation.y=-1.15; scene.add(g);
}else{
  box(cnW,cnH,cnD,M.ivory,0,0.12+cnH/2,cnZ);              // solid body
  if(OPT==='A'){for(let i=0;i<12;i++){box(0.015,cnH*0.8,0.02,M.brass,-cnW/2+0.1+i*((cnW-0.2)/11),0.12+cnH*0.45,cbFront);}}
  const cwm=new THREE.Mesh(new THREE.PlaneGeometry(1.0,0.22),new THREE.MeshStandardMaterial({map:textTex('DOFT','#B8924A',50),transparent:true,roughness:0.6}));
  cwm.position.set(0,0.12+cnH*0.5,cbFront+0.004);scene.add(cwm);
  // subtle under-counter door lines (lockable storage) on the front
  lockHandle(-cnW/2+0.4,0.12+cnH*0.62,cbFront+0.015); lockHandle(cnW/2-0.4,0.12+cnH*0.62,cbFront+0.015);
}

// ================= CAMERA / VIEW =================
const AS=2400/1650;let cam;
if(VIEW==='elev'||VIEW==='elevdim'){const hH=1.6,hW=hH*AS;cam=new THREE.OrthographicCamera(-hW,hW,hH,-hH,0.1,100);cam.position.set(0,1.35,7);cam.lookAt(0,1.35,0);}
else{cam=new THREE.PerspectiveCamera(38,AS,0.1,100);
 const V={hero:[[2.95,2.15,3.7],[0,1.18,0]],rev:[[-2.95,2.05,3.6],[0,1.12,0]],storage:[[2.3,1.7,3.7],[0.15,0.6,0.55]]}[VIEW]||[[2.95,2.15,3.7],[0,1.18,0]];
 cam.position.set(...V[0]);cam.lookAt(...V[1]);}

R.render(scene,cam);requestAnimationFrame(()=>{R.render(scene,cam);window.__done=true;});
</script></body></html>
