<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#d9d4cb;overflow:hidden}#c{display:block}
</style></head><body><canvas id="c" width="2400" height="1650"></canvas>
<script src="node_modules/three/build/three.min.js"></script>
<script>
const P=new URLSearchParams(location.search);
const VIEW=P.get('view')||'left';                 // plan | l45 | r45 | left | right | hero
const AS=2400/1650;

// ---------- palette ----------
const C={
  white:0xF2ECE0, top:0xEAE1CE, gold:0xC6A24E, goldd:0xB4894A,
  green:0x1E4D39, greend:0x163B2C, glass:0xE9F3EF, led:0xFFE7BE,
  candle:0xEFE6D2, char:0x2A2622, cush:0xEDE4D2, floor:0xEBE5DB, ink:0x30302B
};
const M={};
function mat(c,r,m,extra){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m||0},extra||{}));}
M.white=()=>mat(C.white,.55,0);
M.top=()=>mat(C.top,.26,.06,{map:MARBLE});
M.flute=()=>mat(0xEACF97,.3,.5,{emissive:0xFFD79A,emissiveIntensity:.6});
M.gold=()=>mat(C.gold,.24,.95);
M.goldd=()=>mat(C.goldd,.32,.9);
M.green=()=>mat(C.green,.5,.06);
M.glass=()=>mat(C.glass,.05,0,{transparent:true,opacity:.16,depthWrite:false});
M.led=()=>mat(C.led,1,0,{emissive:C.led,emissiveIntensity:1.05});
M.candle=()=>mat(C.candle,.35,.08);
M.cush=()=>mat(C.cush,.75,0);
M.char=()=>mat(C.char,.6,.1);

// ---------- renderer / scene ----------
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setSize(2400,1650,false); R.setPixelRatio(1);
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.06;
R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene(); S.background=new THREE.Color(0xE7E2D8);

// env from gradient equirect
function envTex(){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#fbf7ef');g.addColorStop(.5,'#e9e2d5');g.addColorStop(1,'#c9c2b6');
  x.fillStyle=g;x.fillRect(0,0,512,256);
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;return t;}
const pmrem=new THREE.PMREMGenerator(R); const env=pmrem.fromEquirectangular(envTex()).texture; S.environment=env;

// ---------- canvas textures ----------
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.colorSpace=THREE.SRGBColorSpace;return t;}
function roundText(x,cx,cy,r,str,size,col){x.fillStyle=col;x.font=`${size}px Georgia`;x.textAlign='center';x.textBaseline='middle';
  const n=str.length,step=(Math.PI*2)/n;
  for(let i=0;i<n;i++){const a=-Math.PI/2+i*step;x.save();x.translate(cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.rotate(a+Math.PI/2);x.fillText(str[i],0,0);x.restore();}}
// DOFT seal medallion on emerald
function sealTex(){return tex(1024,1024,(x,W,H)=>{
  x.fillStyle='#1E4D39';x.fillRect(0,0,W,H);
  const cx=W/2,cy=H/2;
  x.strokeStyle='#C6A24E';x.lineWidth=6;x.beginPath();x.arc(cx,cy,W*0.47,0,7);x.stroke();
  x.lineWidth=3;x.beginPath();x.arc(cx,cy,W*0.40,0,7);x.stroke();
  roundText(x,cx,cy,W*0.435,'· DOFT · SCENTED · MEMORIES ',W*0.052,'#C6A24E');
  x.strokeStyle='#EDE6D3';x.lineCap='round';
  x.lineWidth=W*0.028;x.beginPath();x.arc(cx-W*0.02,cy+W*0.05,W*0.20,0.15,Math.PI*1.85);x.stroke();
  x.lineWidth=W*0.024;x.beginPath();x.moveTo(cx,cy-W*0.24);x.lineTo(cx-W*0.01,cy+W*0.24);x.stroke();
  x.lineWidth=W*0.02;x.beginPath();x.moveTo(cx,cy-W*0.24);x.quadraticCurveTo(cx+W*0.16,cy-W*0.16,cx+W*0.14,cy+W*0.02);x.stroke();
});}
// subtle deterministic marble for counter tops
function marbleTex(){return tex(1024,1024,(x,W,H)=>{
  x.fillStyle='#EFE7D5';x.fillRect(0,0,W,H);
  function vein(seed,alpha,wdt){x.strokeStyle=`rgba(176,158,120,${alpha})`;x.lineWidth=wdt;x.beginPath();
    for(let y=0;y<=H;y+=8){const px=W*(0.18+0.64*(0.5+0.42*Math.sin(seed*1.7+y*0.012)+0.14*Math.sin(seed*3.1+y*0.031)));y===0?x.moveTo(px,y):x.lineTo(px,y);}x.stroke();}
  for(let i=0;i<6;i++)vein(i*2.3,0.26,2);
  for(let i=0;i<4;i++)vein(1.1+i*3.7,0.16,3);
});}
// gold DOFT wordmark on green band
function wordmarkTex(w,h){return tex(w,h,(x,W,H)=>{
  x.fillStyle='#1E4D39';x.fillRect(0,0,W,H);
  x.fillStyle='#C6A24E';x.textAlign='center';x.textBaseline='middle';
  x.font=`bold ${H*0.44}px Georgia`;
  const chars='DOFT'.split('');const gap=H*0.10;const widths=chars.map(ch=>x.measureText(ch).width);
  const total=widths.reduce((a,b)=>a+b,0)+gap*(chars.length-1);let px=W/2-total/2;
  chars.forEach((ch,i)=>{x.fillText(ch,px+widths[i]/2,H*0.40);px+=widths[i]+gap;});
  x.font=`${H*0.13}px Georgia`;x.fillStyle='#D8B872';
  x.fillText('S C E N T E D   M E M O R I E S',W/2,H*0.74);
  x.strokeStyle='#C6A24E';x.lineWidth=2;x.beginPath();x.moveTo(W*0.32,H*0.60);x.lineTo(W*0.68,H*0.60);x.stroke();
});}

const MARBLE=marbleTex();

// ---------- helpers ----------
function box(w,h,d,m,x,y,z,tag){const g=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);g.position.set(x,y,z);g.castShadow=true;g.receiveShadow=true;if(tag)g.userData.run=tag;S.add(g);return g;}
function cyl(rt,rb,h,m,x,y,z,seg){const g=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||24),m);g.position.set(x,y,z);g.castShadow=true;g.receiveShadow=true;S.add(g);return g;}
const ghostable=[];
function G(mesh){ghostable.push(mesh);return mesh;}
function frameRect(w,h,t,m,x,y,z){const g=new THREE.Group();
  const parts=[
    new THREE.Mesh(new THREE.BoxGeometry(w,t,t),m),
    new THREE.Mesh(new THREE.BoxGeometry(w,t,t),m),
    new THREE.Mesh(new THREE.BoxGeometry(t,h+t,t),m),
    new THREE.Mesh(new THREE.BoxGeometry(t,h+t,t),m)];
  parts[0].position.y=h/2;parts[1].position.y=-h/2;parts[2].position.x=w/2;parts[3].position.x=-w/2;
  parts.forEach(p=>{p.castShadow=true;g.add(p);});
  g.position.set(x,y,z);S.add(g);return g;}
// 12-edge 3D box frame (vitrine cage)
function boxFrame(w,h,d,t,m,x,y,z,tag){const g=new THREE.Group();
  const V=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]];
  V.forEach(([px,pz])=>{const v=new THREE.Mesh(new THREE.BoxGeometry(t,h,t),m);v.position.set(px,0,pz);g.add(v);});
  [h/2,-h/2].forEach(py=>{
    g.add(new THREE.Mesh(new THREE.BoxGeometry(w,t,t),m).translateY(py).translateZ(d/2));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(w,t,t),m).translateY(py).translateZ(-d/2));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(t,t,d),m).translateY(py).translateX(w/2));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(t,t,d),m).translateY(py).translateX(-w/2));
  });
  g.children.forEach(c=>{c.castShadow=true;if(tag)c.userData.run=tag;});
  g.position.set(x,y,z);S.add(g);return g;}

// ---------- ground ----------
const gp=new THREE.Mesh(new THREE.PlaneGeometry(40,40),mat(C.floor,.92,0));
gp.rotation.x=-Math.PI/2;gp.receiveShadow=true;S.add(gp);
box(2.56,0.06,2.56,M.char(),0,0.03,0);              // dark skirting
box(2.44,0.02,2.44,mat(0xE9E1D1,.55,.02),0,0.07,0); // premium porcelain floor

// ---------- central tower ----------
const TW=0.80, TH=2.30;
const tb=box(TW,TH,TW,M.white(),0,0.08+TH/2,0);
const sealMat=mat(0xffffff,.4,.05,{map:sealTex(),emissive:0x22503b,emissiveIntensity:.35});
const seal=new THREE.Mesh(new THREE.PlaneGeometry(0.66,0.66),sealMat);seal.position.set(0,1.30,TW/2+0.006);S.add(seal);
frameRect(0.70,0.70,0.03,M.gold(),0,1.30,TW/2+0.01);
const wmMat=mat(0xffffff,.5,.05,{map:wordmarkTex(1024,320),emissive:0x1E4D39,emissiveIntensity:.5});
[[0,TW/2+0.006,0],[0,-(TW/2+0.006),Math.PI],[TW/2+0.006,0,-Math.PI/2],[-(TW/2+0.006),0,Math.PI/2]].forEach(([dx,dz,ry])=>{
  const w=new THREE.Mesh(new THREE.PlaneGeometry(0.72,0.22),wmMat);w.position.set(dx,1.98,dz);w.rotation.y=ry;S.add(w);
});
box(TW+0.06,0.05,TW+0.06,M.gold(),0,0.08+TH+0.02,0);
box(0.30,0.10,0.30,M.led(),0,0.08+TH+0.09,0);
function niche(dx,dz,ry){
  const g=new THREE.Group();g.position.set(dx,0,dz);g.rotation.y=ry;S.add(g);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(0.60,1.20),mat(C.green,.5,.05,{emissive:0x2e6047,emissiveIntensity:.6}));
  back.position.set(0,1.30,0.004);g.add(back);
  [0.95,1.35,1.75].forEach(sy=>{
    const sh=new THREE.Mesh(new THREE.BoxGeometry(0.60,0.02,0.14),M.gold());sh.position.set(0,sy-0.10,0.08);sh.castShadow=true;g.add(sh);
    const strip=new THREE.Mesh(new THREE.BoxGeometry(0.56,0.012,0.02),M.led());strip.position.set(0,sy+0.02,0.11);g.add(strip);
    for(let i=-1;i<=1;i++){const cn=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.14,20),M.candle());cn.position.set(i*0.18,sy-0.02,0.08);cn.castShadow=true;g.add(cn);
      const lid=new THREE.Mesh(new THREE.CylinderGeometry(0.052,0.052,0.02,20),M.gold());lid.position.set(i*0.18,sy+0.06,0.08);g.add(lid);}
  });
  // gold frame edges built directly in group
  const t=0.025,fw=0.64,fh=1.24,fy=1.30,fz=0.03;
  [[0,fy+fh/2,fw,t],[0,fy-fh/2,fw,t],[-fw/2,fy,t,fh],[fw/2,fy,t,fh]].forEach(([ex,ey,ew,eh])=>{
    const e=new THREE.Mesh(new THREE.BoxGeometry(ew,eh,t),M.gold());e.position.set(ex,ey,fz);e.castShadow=true;g.add(e);});
}
niche(-(TW/2+0.005),0,-Math.PI/2);
niche( (TW/2+0.005),0, Math.PI/2);
niche(0,-(TW/2+0.005),Math.PI);

// ---------- counter runs ----------
const CH=1.05, TOPT=0.045, BASEH=0.90, PLINTH=0.08;
function counterRun(cx,cz,w,d,tag,clr){
  const base=box(w,BASEH,d,M.white(),cx,PLINTH+BASEH/2,cz,tag);G(base);
  const front=(tag==='front');
  const em=M.flute();
  // backlit reveal behind the flutes (glowing channel)
  if(front){
    const n=Math.max(3,Math.round(w/0.15));
    for(let i=0;i<=n;i++){const t=-w/2+i*(w/n); if(Math.abs(t)<clr)continue;
      const fl=new THREE.Mesh(new THREE.BoxGeometry(0.02,BASEH-0.14,0.02),em);
      fl.position.set(cx+t,PLINTH+BASEH/2,cz+d/2+0.006);fl.castShadow=true;fl.userData.run=tag;S.add(fl);G(fl);}
  }else{const sgn=cx<0?-1:1;const nn=Math.max(3,Math.round(d/0.15));
    for(let i=0;i<=nn;i++){const t=-d/2+i*(d/nn); if(Math.abs(t)<clr)continue;
      const fl=new THREE.Mesh(new THREE.BoxGeometry(0.02,BASEH-0.14,0.02),em);
      fl.position.set(cx+sgn*(w/2+0.006),PLINTH+BASEH/2,cz+t);fl.castShadow=true;fl.userData.run=tag;S.add(fl);G(fl);}
  }
  G(box(w-0.06,0.03,d-0.06,M.led(),cx,PLINTH+0.02,cz));      // toe-kick glow
  G(box(w+0.02,0.02,d+0.02,M.gold(),cx,PLINTH+BASEH+0.01,cz)); // gold reveal under top
  G(box(w+0.06,TOPT,d+0.06,M.top(),cx,CH+TOPT/2,cz,tag));      // marble top
}
counterRun(0,0.97,2.44,0.50,'front',0.82);
counterRun(-0.97,-0.10,0.50,1.64,'left',0.60);
counterRun(0.97,-0.10,0.50,1.64,'right',0.60);

// ---------- fascia signage (branded on all three customer faces) ----------
function fasciaPanel(cx,cy,cz,w,h,ry,tag){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    mat(0xffffff,.5,.05,{map:wordmarkTex(1400,300),emissive:0x1E4D39,emissiveIntensity:.5}));
  p.position.set(cx,cy,cz);p.rotation.y=ry;p.userData.run=tag;S.add(p);G(p);
  const g=new THREE.Group();const t=0.022,fw=w+0.05,fh=h+0.05;
  [[0,fh/2,fw,t],[0,-fh/2,fw,t],[-fw/2,0,t,fh],[fw/2,0,t,fh]].forEach(([ex,ey,ew,eh])=>{
    const e=new THREE.Mesh(new THREE.BoxGeometry(ew,eh,0.022),M.gold());e.position.set(ex,ey,0);e.castShadow=true;e.userData.run=tag;g.add(e);G(e);});
  g.position.set(cx,cy,cz);g.rotation.y=ry;S.add(g);
}
fasciaPanel(0, 0.60, 1.226, 1.5, 0.36, 0,           'front');
fasciaPanel(-1.226, 0.60, -0.10, 1.05, 0.36, -Math.PI/2, 'left');
fasciaPanel(1.226, 0.60, -0.10, 1.05, 0.36,  Math.PI/2, 'right');

// ---------- lockable storage (inside left & right runs) ----------
function storageDoors(cx,cz,d,tag){
  const sgn=cx<0?1:-1; const fx=cx+sgn*(0.25+0.006); const nd=2;
  for(let i=0;i<nd;i++){
    const dz=cz-d/2+d/(nd*2)+i*(d/nd);
    G(box(0.02,0.66,d/nd-0.05,M.white(),fx,0.5,dz,tag));
    const h=new THREE.Mesh(new THREE.BoxGeometry(0.02,0.02,0.18),M.gold());h.position.set(fx+sgn*0.02,0.5,dz);h.castShadow=true;h.userData.run=tag;S.add(h);G(h);
    const lk=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.02,16),M.gold());lk.rotation.z=Math.PI/2;lk.position.set(fx+sgn*0.02,0.66,dz);lk.userData.run=tag;S.add(lk);G(lk);
  }
  for(let i=0;i<3;i++)for(let j=0;j<2;j++){
    const bxm=mat([0xEDE3CE,0xE7D9BE,0xDCE7DD][(i+j)%3],.7,0);
    const bx=box(0.34,0.14,0.30,bxm,cx,0.20+j*0.17,cz-d/2+0.28+i*0.42,'stock');
    box(0.34,0.015,0.30,M.gold(),cx,0.20+j*0.17+0.078,cz-d/2+0.28+i*0.42,'stock');
  }
  if(cx>0){box(0.30,0.24,0.30,M.char(),cx,0.24,cz+d/2-0.32,'stock');
    const dl=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.02,20),M.gold());dl.rotation.x=Math.PI/2;dl.position.set(cx+0.10,0.24,cz+d/2-0.32+0.155);dl.userData.run='stock';S.add(dl);}
}
storageDoors(-0.97,-0.10,1.64,'left');
storageDoors(0.97,-0.10,1.64,'right');

// ---------- glass showcase vitrines ----------
function vitrine(x,z,w,d,h,tag){
  const y0=CH+TOPT;
  box(w+0.03,0.03,d+0.03,M.gold(),x,y0+0.015,z,tag);
  box(w-0.02,0.012,d-0.02,M.led(),x,y0+0.035,z,tag);
  for(let i=-1;i<=1;i++){cyl(0.045,0.045,0.13,M.candle(),x+i*w*0.28,y0+0.10,z,20).userData.run=tag;
    cyl(0.047,0.047,0.02,M.gold(),x+i*w*0.28,y0+0.175,z,20).userData.run=tag;}
  boxFrame(w,h,d,0.016,M.gold(),x,y0+0.03+h/2,z,tag);
  const gl=new THREE.Mesh(new THREE.BoxGeometry(w-0.02,h-0.02,d-0.02),mat(0xDCEAE4,.04,0,{transparent:true,opacity:.28,depthWrite:false}));
  gl.position.set(x,y0+0.03+h/2,z);gl.renderOrder=2;gl.userData.run=tag;S.add(gl);G(gl);
  box(w+0.02,0.02,d+0.02,M.gold(),x,y0+0.03+h+0.02,z,tag);
}
vitrine(-0.62,0.97,0.5,0.34,0.34,'front');
vitrine( 0.62,0.97,0.5,0.34,0.34,'front');
vitrine(-0.97,0.45,0.34,0.42,0.34,'left');
vitrine( 0.97,-0.55,0.34,0.42,0.34,'right');

// ---------- product candles ----------
function candleGroup(x,z,tag){for(let i=0;i<3;i++){const r=0.05+i*0.005;
  cyl(r,r,0.12+i*0.02,M.candle(),x+(i-1)*0.12,CH+TOPT+0.06+i*0.01,z,20).userData.run=tag;
  cyl(r+0.004,r+0.004,0.018,M.gold(),x+(i-1)*0.12,CH+TOPT+0.12+i*0.02,z,20).userData.run=tag;}}
candleGroup(0.97,0.30,'right');

// ---------- POS tablet ----------
const pos=box(0.24,0.16,0.012,mat(0x12110f,.4,.2),0.0,CH+TOPT+0.12,0.85,'front');pos.rotation.x=-0.35;
box(0.10,0.02,0.14,M.goldd(),0,CH+TOPT+0.02,0.85,'front');

// ---------- dried-floral accent ----------
cyl(0.07,0.05,0.20,M.gold(),0.97,CH+TOPT+0.10,-0.40,20).userData.run='right';
for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2;const st=cyl(0.004,0.004,0.34,mat(0xC9B48A,.8,0),0.97+Math.cos(a)*0.05,CH+TOPT+0.34,-0.40+Math.sin(a)*0.05,6);
  st.rotation.z=Math.cos(a)*0.3;st.rotation.x=Math.sin(a)*0.3;st.userData.run='right';}

// ---------- bar stools ----------
function stool(x,z){
  const seat=cyl(0.17,0.17,0.06,M.cush(),x,0.70,z,28);seat.userData.run='stool';G(seat);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.012,10,28),M.gold());rim.rotation.x=Math.PI/2;rim.position.set(x,0.67,z);rim.userData.run='stool';S.add(rim);G(rim);
  for(let i=0;i<4;i++){const a=Math.PI/4+i*Math.PI/2;const lg=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.70,12),M.gold());
    lg.position.set(x+Math.cos(a)*0.13,0.35,z+Math.sin(a)*0.13);lg.rotation.x=Math.sin(a)*0.14;lg.rotation.z=-Math.cos(a)*0.14;lg.castShadow=true;lg.userData.run='stool';S.add(lg);G(lg);}
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.135,0.01,8,24),M.gold());ring.rotation.x=Math.PI/2;ring.position.set(x,0.28,z);ring.userData.run='stool';S.add(ring);G(ring);
}
stool(-0.30,0.45); stool(0.30,0.45);

// ---------- floor mat ----------
const mat0=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),mat(0x24483a,.85,0));mat0.rotation.x=-Math.PI/2;mat0.position.set(0,0.081,0.05);mat0.receiveShadow=true;S.add(mat0);

// ---------- shopping bag accent ----------
[[-1.05,1.35,0],[-0.92,1.30,0.25]].forEach(([x,z,ry])=>{const bg=box(0.18,0.22,0.10,mat(0x1E4D39,.7,0),x,0.19,z);bg.rotation.y=ry;
  const h1=new THREE.Mesh(new THREE.TorusGeometry(0.03,0.004,6,16,Math.PI),M.gold());h1.position.set(x,0.31,z);S.add(h1);});

// ---------- lighting ----------
const planView=(VIEW==='plan');
S.add(new THREE.HemisphereLight(0xffffff,0x8b8070,planView?0.9:0.55));
const key=new THREE.DirectionalLight(0xfff4e2,planView?1.1:2.1);
key.position.set(planView?2:4.5,planView?9:6.5,planView?2:4.0);key.castShadow=!planView;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-4;key.shadow.camera.right=4;key.shadow.camera.top=4;key.shadow.camera.bottom=-4;
key.shadow.camera.near=1;key.shadow.camera.far=25;key.shadow.bias=-0.0004;S.add(key);
const fill=new THREE.DirectionalLight(0xdfe8ff,0.55);fill.position.set(-5,3.5,-2);S.add(fill);
const rim=new THREE.DirectionalLight(0xffe6c0,0.6);rim.position.set(0,3,-6);S.add(rim);
const warm=new THREE.PointLight(0xffd9a0,0.7,6);warm.position.set(0,1.4,1.4);S.add(warm);

// ---------- cross-section ghosting ----------
function cutaway(side){
  ghostable.forEach(mesh=>{
    const r=mesh.userData.run; if(!r)return;
    const isSide=(side==='left')?(r==='left'||r==='front'):(r==='right'||r==='front');
    if(!isSide)return;
    const m=mesh.material;m.transparent=true;m.opacity=0.12;m.depthWrite=false;
  });
}
if(VIEW==='l45')cutaway('left');
if(VIEW==='r45')cutaway('right');

// ---------- camera ----------
let cam;
if(VIEW==='plan'){
  const hH=1.55,hW=hH*AS;
  cam=new THREE.OrthographicCamera(-hW,hW,hH,-hH,0.1,100);
  cam.position.set(0,12,0.001);cam.up.set(0,0,-1);cam.lookAt(0,0,0);
}else{
  cam=new THREE.PerspectiveCamera(31,AS,0.1,100);
  const V={
    left:[[-4.05,2.45,3.95],[0,1.22,0]],
    right:[[4.05,2.45,3.95],[0,1.22,0]],
    l45:[[-3.25,2.05,3.95],[-0.1,0.9,0.05]],
    r45:[[3.25,2.05,3.95],[0.1,0.9,0.05]],
    hero:[[3.4,2.4,4.2],[0,1.15,0]]
  }[VIEW]||[[3.1,2.15,3.9],[0,1.05,0]];
  cam.position.set(...V[0]);cam.lookAt(...V[1]);
}

// ---------- render ----------
let f=0;(function loop(){f++;R.render(S,cam);if(f<4){requestAnimationFrame(loop);}else{window.__done=true;}})();
</script></body></html>
