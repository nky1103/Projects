<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/inter-500.ttf'); font-weight:500; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-600.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-700.ttf'); font-weight:700; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-800.ttf'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-900.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05070b; }
  :root { --acc:#f59e0b; --deep:#b45309; --glow:245,158,11; }
  .slide { width:1080px; height:1350px; position:relative; overflow:hidden;
    background:#080b11; font-family:'Inter',sans-serif; color:#f4f1ea; }
  .slide::before { content:''; position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(760px 600px at 88% -6%, rgba(var(--glow),.20), transparent 62%),
      radial-gradient(880px 700px at -12% 106%, rgba(var(--glow),.10), transparent 60%); }
  .slide::after { content:''; position:absolute; inset:0; z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.024) 1px, transparent 1px);
    background-size:90px 90px;
    -webkit-mask-image:radial-gradient(1000px 1200px at 50% 45%, #000 30%, transparent 100%);
    mask-image:radial-gradient(1000px 1200px at 50% 45%, #000 30%, transparent 100%); }

  .pad { position:absolute; inset:0; z-index:3; padding:96px 88px; display:flex; flex-direction:column; }
  /* header */
  .top { display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:18px; }
  .brand .mark { width:60px; height:60px; border-radius:17px;
    background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 26px rgba(245,158,11,.36); }
  .brand .name { font-weight:800; font-size:30px; color:#ece7dd; letter-spacing:-.5px; }
  .brand .name span { color:var(--acc); }
  .pill { font-weight:700; font-size:20px; letter-spacing:2.5px; color:#7b8494; text-transform:uppercase; }

  .kick { font-weight:700; font-size:26px; letter-spacing:3px; text-transform:uppercase; color:var(--acc); }
  h1 { font-weight:900; letter-spacing:-2px; line-height:1.08; font-size:96px; }
  h1.sm { font-size:78px; } h1.xs { font-size:62px; }
  h2 { font-weight:900; letter-spacing:-1.5px; line-height:1.1; font-size:74px; }
  h2.sm { font-size:60px; }
  p.body { font-weight:500; font-size:38px; line-height:1.45; color:#c7ccd6; }
  p.body b { color:#fff; font-weight:800; }
  .accent { color:var(--acc); }
  .dim { color:#8b93a3; }

  .foot { margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    font-weight:600; font-size:24px; color:#5b6472; }
  .foot .src { max-width:70%; }
  .swipe { display:flex; align-items:center; gap:12px; color:var(--acc); font-weight:800; font-size:26px; }

  .center { justify-content:center; }
  .bignum { font-weight:900; letter-spacing:-3px; font-size:210px; line-height:0.95;
    background:linear-gradient(135deg,#fff, var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .bignum.sm { font-size:150px; }
  .subnum { font-weight:700; font-size:40px; color:#c7ccd6; margin-top:10px; }

  /* bar chart */
  .chart { margin-top:30px; display:flex; flex-direction:column; gap:26px; }
  .bar { display:flex; align-items:center; gap:22px; }
  .bar .lbl { width:150px; font-weight:800; font-size:34px; color:#d7dbe3; text-align:right; }
  .bar .track { flex:1; height:64px; background:rgba(255,255,255,.05); border-radius:12px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:12px;
    background:linear-gradient(90deg, var(--deep), var(--acc)); display:flex; align-items:center;
    justify-content:flex-end; padding-right:22px; font-weight:800; font-size:30px; color:#08110a; }
  .bar.muted .fill { background:linear-gradient(90deg,#3a4150,#59626f); color:#e8ecf2; }

  .lesson { border-left:9px solid var(--acc); border-radius:8px 26px 26px 8px;
    background:rgba(var(--glow),.10); padding:44px 48px; }
  .lesson .tag { font-weight:800; font-size:26px; letter-spacing:2px; text-transform:uppercase; color:var(--acc); margin-bottom:16px; }
  .lesson .tx { font-weight:800; font-size:52px; line-height:1.18; }

  .follow { display:flex; align-items:center; gap:26px; margin-top:20px; }
  .follow .mark { width:96px; height:96px; border-radius:26px; background:linear-gradient(135deg,#f59e0b,#ea580c);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 12px 34px rgba(245,158,11,.4); }
  .follow .ftx { font-weight:800; font-size:46px; } .follow .ftx .sub { display:block; font-weight:600; font-size:30px; color:#aab2c0; margin-top:6px; }
</style>

<svg width="0" height="0" style="position:absolute"><symbol id="owl" viewBox="0 0 200 200">
  <path d="M60 60 L74 32 L88 58 Z" fill="#0b0e14"/><path d="M140 60 L126 32 L112 58 Z" fill="#0b0e14"/>
  <path d="M100 38 C 150 38 164 80 164 118 C 164 160 138 180 100 180 C 62 180 36 160 36 118 C 36 80 50 38 100 38 Z" fill="#0b0e14"/>
  <circle cx="75" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/><circle cx="125" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/>
  <rect x="97.5" y="94" width="5" height="8" rx="2.5" fill="#fef3c7"/>
  <circle cx="75" cy="98" r="12.5" fill="#fbbf24"/><circle cx="75" cy="98" r="5.5" fill="#0b0e14"/>
  <circle cx="125" cy="98" r="12.5" fill="#fbbf24"/><circle cx="125" cy="98" r="5.5" fill="#0b0e14"/>
  <path d="M100 115 L90 128 L110 128 Z" fill="#f59e0b"/></symbol></svg>

<div class="slide" id="slide"><div class="pad" id="pad"></div></div>

<script>
const C = window.CONFIG;
document.documentElement.style.setProperty('--acc', C.acc);
document.documentElement.style.setProperty('--deep', C.deep);
document.documentElement.style.setProperty('--glow', C.glow);

function header(showPill){
  return `<div class="top"><div class="brand"><div class="mark"><svg width="42" height="42"><use href="#owl"/></svg></div>`+
    `<div class="name">Startup<span>Sutra</span></div></div>`+
    (showPill?`<div class="pill">${C.label}</div>`:``)+`</div>`;
}
function foot(src, swipe){
  return `<div class="foot"><div class="src">${src?('Source: '+src):'@statupsutra'}</div>`+
    (swipe?`<div class="swipe">Swipe →</div>`:`<div class="swipe">@statupsutra</div>`)+`</div>`;
}
function bars(data){
  const max = Math.max(...data.map(d=>d.v));
  return `<div class="chart">`+data.map(d=>{
    const w = Math.max(12, Math.round(d.v/max*100));
    return `<div class="bar ${d.muted?'muted':''}"><div class="lbl">${d.lbl}</div>`+
      `<div class="track"><div class="fill" style="width:${w}%">${d.disp||d.v}</div></div></div>`;
  }).join('')+`</div>`;
}

window.renderSlide = function(i){
  const s = C.slides[i];
  const pad = document.getElementById('pad');
  let inner = header(s.type!=='cover');
  if (s.type==='cover'){
    inner += `<div style="margin-top:64px"></div>`;
    if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
    inner += `<h1 class="${s.size||''}" style="margin-top:24px">${s.title}</h1>`;
    if(s.sub) inner += `<p class="body" style="margin-top:36px">${s.sub}</p>`;
    inner += foot(null, true);
  } else if (s.type==='bignum'){
    inner += `<div class="pad center" style="position:static;padding:0;flex:1;justify-content:center">`;
    if(s.kick) inner += `<div class="kick" style="margin-bottom:20px">${s.kick}</div>`;
    inner += `<div class="bignum ${s.size||''}">${s.num}</div>`;
    if(s.subnum) inner += `<div class="subnum">${s.subnum}</div>`;
    if(s.note) inner += `<p class="body" style="margin-top:40px">${s.note}</p>`;
    inner += `</div>`+foot(s.src, s.swipe);
  } else if (s.type==='bars'){
    if(s.kick) inner += `<div class="kick" style="margin-top:56px">${s.kick}</div>`;
    inner += `<h2 class="${s.size||''}" style="margin-top:18px">${s.title}</h2>`;
    inner += bars(s.data);
    inner += foot(s.src, s.swipe);
  } else if (s.type==='lesson'){
    inner += `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px">`;
    inner += `<div class="lesson"><div class="tag">${s.tag||'The Lesson'}</div><div class="tx">${s.tx}</div></div>`;
    if(s.note) inner += `<p class="body">${s.note}</p>`;
    inner += `</div>`+foot(s.src, s.swipe);
  } else if (s.type==='cta'){
    inner += `<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px">`;
    inner += `<h2 class="sm">${s.title}</h2>`;
    if(s.note) inner += `<p class="body">${s.note}</p>`;
    inner += `<div class="follow"><div class="mark"><svg width="64" height="64"><use href="#owl"/></svg></div>`+
      `<div class="ftx">Follow @statupsutra<span class="sub">${s.subfollow||'Dubai real estate, decoded with data'}</span></div></div>`;
    inner += `</div>`+foot(null, false);
  }
  pad.outerHTML = `<div class="pad" id="pad">${inner}</div>`;
};
window.NSLIDES = C.slides.length;
renderSlide(0);
</script>
