<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/inter-800.ttf'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-900.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:'Inter',sans-serif; }

  .pfp { width:1024px; height:1024px; position:relative; overflow:hidden; background:#0b0e14; }
  .pfp::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(700px 560px at 78% 6%, rgba(245,158,11,.20), transparent 65%),
      radial-gradient(760px 620px at 8% 100%, rgba(245,158,11,.12), transparent 60%);
  }
  .pfp::after {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:86px 86px;
    mask-image:radial-gradient(760px 760px at 50% 50%, #000 30%, transparent 100%);
    -webkit-mask-image:radial-gradient(760px 760px at 50% 50%, #000 30%, transparent 100%);
  }
  .inner { position:relative; z-index:2; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* Option A: the S tile (exactly the header mark, scaled) */
  .tile {
    width:520px; height:520px; border-radius:148px;
    background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 45%,#ea580c 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 60px 180px rgba(245,158,11,.42), inset 0 -14px 40px rgba(0,0,0,.18);
  }
  .tile span { font-weight:900; font-size:330px; color:#0b0e14; letter-spacing:-8px; }

  /* Option B: full amber, dark S */
  .pfp.amber { background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 42%,#ea580c 100%); }
  .pfp.amber::before { background:radial-gradient(900px 700px at 30% 20%, rgba(255,255,255,.18), transparent 60%); }
  .pfp.amber::after { display:none; }
  .bigS { font-weight:900; font-size:640px; color:#0b0e14; letter-spacing:-14px; }

  /* Option C: tile + four series dots */
  .dots { display:flex; gap:44px; margin-top:96px; }
  .dots i { width:56px; height:56px; border-radius:18px; }
</style>

<!-- OPTION A -->
<div class="pfp" id="a">
  <div class="inner">
    <div class="tile"><span>S</span></div>
  </div>
</div>

<!-- OPTION B -->
<div class="pfp amber" id="b">
  <div class="inner">
    <div class="bigS">S</div>
  </div>
</div>

<!-- OPTION C -->
<div class="pfp" id="c">
  <div class="inner">
    <div class="tile" style="width:460px; height:460px; border-radius:130px;"><span style="font-size:290px;">S</span></div>
    <div class="dots">
      <i style="background:#f59e0b;"></i>
      <i style="background:#ef4444;"></i>
      <i style="background:#3b82f6;"></i>
      <i style="background:#22c55e;"></i>
    </div>
  </div>
</div>
