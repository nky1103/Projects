<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/inter-700.ttf'); font-weight:700; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-800.ttf'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-900.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; }
  #stage { width:1080px; height:1920px; position:relative; overflow:hidden; background:#0b0e14; font-family:'Inter','Noto Color Emoji',sans-serif; color:#f4f1ea; }
  #stage::before { content:''; position:absolute; inset:0; z-index:0;
    background:radial-gradient(760px 600px at 88% -4%, rgba(139,92,246,.17), transparent 65%),radial-gradient(900px 700px at -12% 106%, rgba(139,92,246,.10), transparent 60%); }
  #stage::after { content:''; position:absolute; inset:0; z-index:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:90px 90px; mask-image:radial-gradient(1000px 1300px at 50% 45%, #000 30%, transparent 100%); -webkit-mask-image:radial-gradient(1000px 1300px at 50% 45%, #000 30%, transparent 100%); }
  .chrome { position:absolute; left:0; right:0; z-index:5; display:flex; align-items:center; padding:0 84px; }
  #hdr { top:84px; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:18px; }
  .brand .mark { width:60px; height:60px; border-radius:17px; background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 28px rgba(245,158,11,.35); }
  .brand .name { font-weight:700; font-size:32px; color:#e8e4da; }
  .brand .name span { color:#f59e0b; }
  .tag { font-weight:700; font-size:24px; letter-spacing:3px; color:#6b7280; text-transform:uppercase; }
  #ftr { bottom:84px; justify-content:center; font-weight:700; font-size:26px; color:#525a68; letter-spacing:1px; }
  .scene { position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; justify-content:center; padding:0 96px; opacity:0; }
  .el { opacity:0; will-change:transform,opacity; }
  h1 { font-weight:900; letter-spacing:-2px; line-height:1.16; font-size:100px; }
  .accent { color:#8b5cf6; }
  .dim { color:#8b93a3; }
  .huge { font-size:200px; letter-spacing:-6px; }
  .kicker { display:inline-flex; align-self:flex-start; align-items:center; gap:16px; font-weight:700; font-size:28px; letter-spacing:4px; text-transform:uppercase; color:#8b5cf6; margin-bottom:44px; padding:16px 30px; border:1.5px solid rgba(139,92,246,.45); border-radius:999px; background:rgba(139,92,246,.08); }
  .kicker .sq { width:20px; height:20px; border-radius:5px; background:linear-gradient(135deg,#8b5cf6,#6d28d9); }
  .followcard { margin-top:56px; display:flex; align-items:center; gap:30px; border-left:9px solid #8b5cf6; border-radius:8px 30px 30px 8px; background:rgba(139,92,246,.10); padding:40px 48px; }
</style>
<svg width="0" height="0" style="position:absolute"><symbol id="owl" viewBox="0 0 200 200">
  <path d="M60 60 L74 32 L88 58 Z" fill="#0b0e14"/><path d="M140 60 L126 32 L112 58 Z" fill="#0b0e14"/>
  <path d="M100 38 C 150 38 164 80 164 118 C 164 160 138 180 100 180 C 62 180 36 160 36 118 C 36 80 50 38 100 38 Z" fill="#0b0e14"/>
  <circle cx="75" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/><circle cx="125" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/>
  <rect x="97.5" y="94" width="5" height="8" rx="2.5" fill="#fef3c7"/>
  <circle cx="75" cy="98" r="12.5" fill="#fbbf24"/><circle cx="75" cy="98" r="5.5" fill="#0b0e14"/>
  <circle cx="125" cy="98" r="12.5" fill="#fbbf24"/><circle cx="125" cy="98" r="5.5" fill="#0b0e14"/>
  <path d="M100 115 L90 128 L110 128 Z" fill="#f59e0b"/></symbol></svg>

<div id="stage">
  <div class="chrome" id="hdr"><div class="brand"><div class="mark"><svg width="46" height="46"><use href="#owl"/></svg></div><div class="name">Startup<span>Sutra</span></div></div><div class="tag">Seed Signal #001</div></div>
  <div class="chrome" id="ftr">@statupsutra</div>
  <div id="scenes"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a,v));
const p = (t,t0,d) => clamp((t-t0)/d, 0, 1);
const easeOut = x => 1 - Math.pow(1-x, 3);
const easeOutBack = x => { const c = 1.7; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };

// Reel definitions — punchy: fast in, hard pop, short holds
const REELS = {
  teaser: { dur: 6.5, hideChrome: 3.2, scenes: [
    { id:'t1', t0:0.0, t1:2.6, html:'<h1 style="font-size:104px;">Investors just funded <span class="accent">plastic…</span></h1>', els:[{tIn:0.0,dIn:0.28,y:36}] },
    { id:'t2', t0:2.6, t1:4.4, html:'<h1 style="font-size:112px;">…that <span class="accent">disappears.</span></h1>', els:[{tIn:2.68,pop:true,dIn:0.32}] },
    { id:'t3', t0:4.4, t1:6.5, hold:true, html:'<h1 class="huge accent" style="text-align:center;">Why?</h1><div class="el" style="text-align:center;font-weight:700;font-size:40px;color:#8b93a3;margin-top:40px;">Full breakdown → today\'s carousel</div>', els:[{tIn:4.5,pop:true,dIn:0.3},{tIn:5.2}] },
  ]},
  lesson: { dur: 16.5, hideChrome: 3.2, scenes: [
    { id:'l1', t0:0.0, t1:2.8, html:'<h1 style="font-size:96px;">Everyone thinks <span class="accent">sustainability sells.</span></h1>', els:[{tIn:0.0,dIn:0.28,y:36}] },
    { id:'l2', t0:2.8, t1:4.8, html:'<h1 class="huge">It <span class="accent">doesn\'t.</span></h1>', els:[{tIn:2.88,pop:true,dIn:0.3}] },
    { id:'l3', t0:4.8, t1:7.2, html:'<h1 style="font-size:120px;"><span class="accent">Economics</span> sells.</h1>', els:[{tIn:4.9,pop:true,dIn:0.32}] },
    { id:'l4', t0:7.2, t1:11.4, html:'<h1 style="font-size:82px;">BZERO made eco-friendly plastic…</h1><h1 style="font-size:82px;margin-top:56px;" class="el2">…<span class="accent">without charging more.</span></h1>', els:[{tIn:7.3,dIn:0.4},{tIn:9.4,pop:true,cls:'el2'}] },
    { id:'l5', t0:11.4, t1:14.0, html:'<h1 style="font-size:94px;">That\'s why investors <span class="accent">invested.</span></h1>', els:[{tIn:11.5,pop:true}] },
    { id:'l6', t0:14.0, t1:16.5, hold:true, html:'<h1 style="font-size:70px;">Seed Signal · <span class="accent">every Wednesday.</span></h1><div class="followcard el" style="margin-top:44px;"><div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#f59e0b,#ea580c);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="62" height="62"><use href="#owl"/></svg></div><div style="font-weight:800;font-size:48px;">Follow <span class="accent">@statupsutra</span><br><span style="font-weight:600;font-size:32px;color:#aab2c0;">what makes investors believe</span></div></div>', els:[{tIn:14.1,pop:true},{tIn:14.8,cls:'el'}] },
  ]},
  hottake: { dur: 10.5, hideChrome: 3.2, scenes: [
    { id:'h1', t0:0.0, t1:2.2, html:'<div class="kicker"><span class="sq"></span>Hot take</div><h1 style="font-size:104px;">Being greener <span class="dim">isn\'t</span> enough.</h1>', els:[{tIn:0.0,dIn:0.3,y:20},{tIn:0.05,dIn:0.26,y:32}] },
    { id:'h2', t0:2.2, t1:5.4, html:'<h1 style="font-size:88px;">Customers don\'t change because something is <span class="dim">greener.</span></h1>', els:[{tIn:2.3,dIn:0.35}] },
    { id:'h3', t0:5.4, t1:8.0, html:'<h1 style="font-size:100px;">They change because it\'s <span class="accent">easier.</span></h1>', els:[{tIn:5.5,pop:true}] },
    { id:'h4', t0:8.0, t1:10.5, hold:true, html:'<h1 class="huge accent" style="text-align:center;">Agree?</h1><div class="followcard el" style="margin-top:44px;"><div style="width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#f59e0b,#ea580c);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="62" height="62"><use href="#owl"/></svg></div><div style="font-weight:800;font-size:48px;">Follow <span class="accent">@statupsutra</span><br><span style="font-weight:600;font-size:32px;color:#aab2c0;">seed signal · every wednesday</span></div></div>', els:[{tIn:8.1,pop:true},{tIn:8.8,cls:'el'}] },
  ]},
};

let CUR = null;
window.buildReel = function(name) {
  CUR = REELS[name];
  const c = $('scenes'); c.innerHTML = '';
  CUR.scenes.forEach(s => {
    const d = document.createElement('div'); d.className='scene'; d.id=s.id; d.innerHTML = s.html;
    c.appendChild(d);
    // els map to top-level children by index
    s._els = s.els.map((e, i) => {
      const node = d.children[i];
      if (node) node.classList.add('el');
      return { node, ...e };
    });
  });
};

function anim(o, t) {
  const {node, tIn, tOut=999, dIn=0.5, y=70, pop=false} = o;
  if (!node) return;
  const ip = p(t, tIn, dIn); const i = easeOutBack(ip); const ot = 1 - p(t, tOut, 0.4);
  node.style.opacity = (easeOut(ip)*ot).toFixed(3);
  node.style.transform = `translateY(${((1-i)*y).toFixed(1)}px) scale(${(pop?(0.7+0.3*i):1).toFixed(3)})`;
}

window.seek = function(t) {
  const ch = easeOut(p(t, CUR.hideChrome, 0.5)); $('hdr').style.opacity=ch; $('ftr').style.opacity=ch;
  CUR.scenes.forEach(s => {
    const d = $(s.id); const vis = (t >= s.t0-0.1 && t <= s.t1+0.6);
    if (!vis) { d.style.opacity=0; return; }
    const fi = p(t, s.t0, 0.2); const fo = s.hold ? 1 : 1 - p(t, s.t1-0.2, 0.25);
    d.style.opacity = (fi*fo).toFixed(3);
    d.style.transform = `scale(${(1.0 + 0.05*p(t,s.t0,s.t1-s.t0)).toFixed(4)})`;
    s._els.forEach(e => anim(e, t));
  });
};
buildReel('teaser'); seek(0);
</script>
