<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/inter-600.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-700.ttf'); font-weight:700; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-800.ttf'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-900.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; font-family:'Inter','Noto Color Emoji',sans-serif; }
  .frame { width:1080px; height:1920px; position:relative; overflow:hidden; color:#f4f1ea; }

  /* brand furniture */
  .chrome { position:absolute; left:0; right:0; display:flex; align-items:center; padding:0 84px; }
  .hdr { top:84px; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:18px; }
  .brand .mark { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .brand .name { font-weight:700; font-size:34px; color:#e8e4da; text-shadow:0 2px 12px rgba(0,0,0,.6); } .brand .name span { color:#f59e0b; }
  .tag { font-weight:800; font-size:22px; letter-spacing:2px; color:#14b8a6; text-transform:uppercase; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .ftr { bottom:96px; justify-content:center; gap:20px; }
  .handle { font-weight:800; font-size:34px; color:#f4f1ea; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  .followpill { font-weight:700; font-size:24px; color:#0b0e14; background:#14b8a6; border-radius:99px; padding:12px 26px; }

  /* data cards */
  .cardwrap { position:absolute; left:0; right:0; top:1000px; display:flex; justify-content:center; }
  .card { width:884px; background:rgba(11,14,20,.76); border:2px solid rgba(20,184,166,.55); border-left:10px solid #14b8a6;
    border-radius:12px 34px 34px 12px; padding:52px 60px; box-shadow:0 26px 70px rgba(0,0,0,.5); }
  .eyebrow { display:inline-flex; align-items:center; gap:14px; font-weight:800; font-size:24px; letter-spacing:4px; text-transform:uppercase; color:#14b8a6; margin-bottom:26px; }
  .eyebrow .sq { width:18px; height:18px; border-radius:5px; background:linear-gradient(135deg,#14b8a6,#0f766e); }
  .big { font-weight:900; letter-spacing:-1.5px; line-height:1.1; color:#f4f1ea; }
  .num { color:#14b8a6; }
  .sub { margin-top:20px; font-weight:600; font-size:36px; color:#aab2c0; line-height:1.3; }

  svg.owl { width:48px; height:48px; }
</style>
<svg width="0" height="0" style="position:absolute"><symbol id="owl" viewBox="0 0 200 200">
  <path d="M60 60 L74 32 L88 58 Z" fill="#0b0e14"/><path d="M140 60 L126 32 L112 58 Z" fill="#0b0e14"/>
  <path d="M100 38 C 150 38 164 80 164 118 C 164 160 138 180 100 180 C 62 180 36 160 36 118 C 36 80 50 38 100 38 Z" fill="#0b0e14"/>
  <circle cx="75" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/><circle cx="125" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/>
  <rect x="97.5" y="94" width="5" height="8" rx="2.5" fill="#fef3c7"/>
  <circle cx="75" cy="98" r="12.5" fill="#fbbf24"/><circle cx="75" cy="98" r="5.5" fill="#0b0e14"/>
  <circle cx="125" cy="98" r="12.5" fill="#fbbf24"/><circle cx="125" cy="98" r="5.5" fill="#0b0e14"/>
  <path d="M100 115 L90 128 L110 128 Z" fill="#f59e0b"/></symbol></svg>

<!-- PERSISTENT BRAND FRAME -->
<div class="frame" id="brand">
  <div class="chrome hdr">
    <div class="brand"><div class="mark"><svg class="owl"><use href="#owl"/></svg></div><div class="name">Startup<span>Sutra</span></div></div>
    <div class="tag">Growth Capital · #004</div>
  </div>
  <div class="chrome ftr">
    <div class="handle">@statupsutra</div>
    <div class="followpill">Follow +</div>
  </div>
</div>

<!-- CARD 1 -->
<div class="frame" id="c1"><div class="cardwrap"><div class="card">
  <div class="eyebrow"><span class="sq"></span>The Round</div>
  <div class="big" style="font-size:130px;"><span class="num">₹107 Cr</span></div>
  <div class="sub">Series A, led by <b style="color:#f4f1ea;">Zoho</b></div>
</div></div></div>

<!-- CARD 2 -->
<div class="frame" id="c2"><div class="cardwrap"><div class="card">
  <div class="eyebrow"><span class="sq"></span>What They Build</div>
  <div class="big" style="font-size:88px;">Edge-AI <span class="num">chips</span></div>
  <div class="sub">Made in India, with its own IP</div>
</div></div></div>

<div class="frame" id="c3"><div class="cardwrap"><div class="card">
  <div class="eyebrow"><span class="sq"></span>The Gap</div>
  <div class="big" style="font-size:76px;">India imports <span class="num">nearly every chip</span> it runs on.</div>
</div></div></div>

<div class="frame" id="c4"><div class="cardwrap"><div class="card">
  <div class="eyebrow"><span class="sq"></span>The Thesis</div>
  <div class="big" style="font-size:82px;">Fund the <span class="num">chip</span>, not the app.</div>
</div></div></div>
