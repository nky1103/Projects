<meta charset="utf-8">
<style>
  @font-face { font-family:'Inter'; src:url('fonts/inter-600.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-700.ttf'); font-weight:700; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-800.ttf'); font-weight:800; }
  @font-face { font-family:'Inter'; src:url('fonts/inter-900.ttf'); font-weight:900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --acc:var(--acc); --acc2:var(--acc2); --deep:var(--deep); --accrgb:20,184,166; --deeprgb:15,118,110; }
  body { background:#000; overflow:hidden; }
  #stage { width:1080px; height:1920px; position:relative; overflow:hidden; background:#0a0d12; font-family:'Inter','Noto Color Emoji',sans-serif; color:#f4f1ea; }
  #stage::before { content:''; position:absolute; inset:0; z-index:0;
    background:radial-gradient(900px 700px at 50% 8%, rgba(var(--accrgb),.12), transparent 60%),
      radial-gradient(1000px 800px at 50% 100%, rgba(var(--deeprgb),.14), transparent 62%); }

  #scene { position:absolute; z-index:1; left:0; top:300px; width:1080px; height:1080px; overflow:hidden; transform-origin:50% 45%; will-change:transform; }
  #scene > img { display:block; width:1080px; height:1080px; }
  #scene::after { content:''; position:absolute; inset:0; z-index:5;
    background:linear-gradient(180deg, #0a0d12 0%, transparent 12%, transparent 84%, #0a0d12 100%); }

  /* head sprite (nods / tilts) with beak + eyelids as children */
  #headsprite { position:absolute; z-index:3; left:43.95%; top:29.3%; width:47.85%; transform-origin:49% 100%; will-change:transform; }
  #headsprite > img { display:block; width:100%; height:auto; }
  #headsprite .lm { position:absolute; will-change:transform,opacity; pointer-events:none; }
  #beak { width:40px; height:36px; left:27.1%; top:65.5%; margin-left:-20px; margin-top:-7px;
    background:radial-gradient(closest-side, #150b04 0%, #29160d 66%, rgba(41,22,13,0) 100%);
    border-radius:46% 46% 54% 54%; opacity:0; transform:scaleY(.12); transform-origin:50% 0%; }
  .lid { width:66px; height:46px; margin-left:-33px; margin-top:-27px;
    background:linear-gradient(180deg,#efe6d6 0%,#e4d4bd 100%); border-radius:0 0 46% 46%; opacity:0; transform:scaleY(0); transform-origin:50% 0%; }
  #lidL { left:22.0%; top:50.5%; } #lidR { left:49.4%; top:48.0%; }

  #screencover { position:absolute; z-index:4; left:0.2%; top:8.3%; width:48.6%; height:27%;
    background:radial-gradient(120% 130% at 30% 20%, #0b2129, #06111a 72%); border:2px solid rgba(var(--accrgb),.5);
    border-radius:7px; transform:perspective(1400px) rotateY(5deg); transform-origin:left center; box-shadow:inset 0 0 45px rgba(var(--accrgb),.16);
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:6px; padding:0 20px; text-align:center; overflow:hidden; }
  #screencover .live { display:flex; align-items:center; gap:9px; font-weight:800; font-size:20px; letter-spacing:2px; color:var(--acc2); text-transform:uppercase; }
  #screencover .live .d { width:11px; height:11px; border-radius:50%; background:#ef4444; box-shadow:0 0 9px #ef4444; }
  #screencover .live b { color:#e8e4da; font-weight:900; } #screencover .live b span{ color:#f59e0b; }
  #scrline { min-height:24px; }
  #scrline .b { font-weight:800; font-size:16px; letter-spacing:2px; color:#aab2c0; text-transform:uppercase; }
  #scrline .eb { font-weight:800; font-size:14px; letter-spacing:2px; color:var(--acc2); text-transform:uppercase; margin-bottom:5px; }
  #scrline .bg { font-weight:900; letter-spacing:-.5px; line-height:1.04; color:#f4f1ea; } #scrline .num{ color:var(--acc2); }
  #scrline .sm { margin-top:5px; font-weight:600; font-size:18px; color:#aab2c0; }

  .chrome { position:absolute; left:0; right:0; z-index:8; display:flex; align-items:center; padding:0 76px; }
  #hdr { top:80px; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand .mark { width:60px; height:60px; border-radius:17px; background:linear-gradient(135deg,#f59e0b,#ea580c); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .brand .name { font-weight:700; font-size:32px; color:#e8e4da; } .brand .name span { color:#f59e0b; }
  .rec { display:flex; align-items:center; gap:10px; font-weight:800; font-size:22px; letter-spacing:2px; color:#f4f1ea; }
  .rec .dot { width:16px; height:16px; border-radius:50%; background:#ef4444; box-shadow:0 0 14px #ef4444; }
  .rec .tc { color:#9aa1ae; font-weight:700; }

  .hook { position:absolute; z-index:7; top:150px; left:84px; right:84px; text-align:center; opacity:0; will-change:transform,opacity; }
  .hook h1 { font-weight:900; font-size:66px; line-height:1.16; letter-spacing:-1.5px; text-wrap:balance; text-shadow:0 3px 16px rgba(0,0,0,.7); }
  .hook h1 .ac { color:var(--acc2); }

  .cardwrap { position:absolute; z-index:6; left:0; right:0; top:1140px; display:flex; justify-content:center; }
  .card { position:absolute; width:900px; opacity:0; will-change:transform,opacity;
    background:rgba(8,11,17,.9); border:2px solid rgba(var(--accrgb),.6); border-left:11px solid var(--acc);
    border-radius:12px 32px 32px 12px; padding:40px 52px; box-shadow:0 30px 80px rgba(0,0,0,.7); }
  .card .eyebrow { display:inline-flex; align-items:center; gap:14px; font-weight:800; font-size:23px; letter-spacing:4px; text-transform:uppercase; color:var(--acc2); margin-bottom:18px; }
  .card .eyebrow .sq { width:17px; height:17px; border-radius:5px; background:linear-gradient(135deg,var(--acc),var(--deep)); }
  .card .big { font-weight:900; letter-spacing:-1.5px; line-height:1.08; color:#f4f1ea; }
  .card .num { color:var(--acc2); }
  .card .sub { margin-top:14px; font-weight:600; font-size:32px; color:#aab2c0; line-height:1.3; }

  #subs { position:absolute; z-index:7; left:80px; right:80px; bottom:250px; display:flex; justify-content:center; }
  .sub-line { display:inline-block; opacity:0; text-align:center; font-weight:800; font-size:43px; line-height:1.3;
    color:#f4f1ea; background:rgba(8,11,17,.78); border-radius:16px; padding:14px 28px; max-width:920px; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  .sub-line .hl { color:var(--acc2); }

  #ftr { position:absolute; z-index:8; left:0; right:0; bottom:120px; display:flex; justify-content:center; opacity:0; }
  .followpill { font-weight:800; font-size:30px; color:#0b0e14; background:var(--acc); border-radius:99px; padding:16px 40px; box-shadow:0 10px 30px rgba(var(--accrgb),.35); }
</style>
<svg width="0" height="0" style="position:absolute"><symbol id="owlmark" viewBox="0 0 200 200">
  <path d="M60 60 L74 32 L88 58 Z" fill="#0b0e14"/><path d="M140 60 L126 32 L112 58 Z" fill="#0b0e14"/>
  <path d="M100 38 C 150 38 164 80 164 118 C 164 160 138 180 100 180 C 62 180 36 160 36 118 C 36 80 50 38 100 38 Z" fill="#0b0e14"/>
  <circle cx="75" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/><circle cx="125" cy="98" r="31" fill="#0b0e14" stroke="#fef3c7" stroke-width="8"/>
  <rect x="97.5" y="94" width="5" height="8" rx="2.5" fill="#fef3c7"/>
  <circle cx="75" cy="98" r="12.5" fill="#fbbf24"/><circle cx="75" cy="98" r="5.5" fill="#0b0e14"/>
  <circle cx="125" cy="98" r="12.5" fill="#fbbf24"/><circle cx="125" cy="98" r="5.5" fill="#0b0e14"/>
  <path d="M100 115 L90 128 L110 128 Z" fill="#f59e0b"/></symbol></svg>

<div id="stage">
  <div id="scene">
    <img src="owl_scene.png" alt="owl studio">
    <div id="screencover">
      <div class="live"><span class="d"></span>Live · <b>Startup<span>Sutra</span></b></div>
      <div id="scrline"></div>
    </div>
    <div id="headsprite">
      <img src="head_sprite.png" alt="">
      <div class="lm" id="beak"></div>
      <div class="lm lid" id="lidL"></div>
      <div class="lm lid" id="lidR"></div>
    </div>
  </div>

  <div class="chrome" id="hdr">
    <div class="brand"><div class="mark"><svg width="46" height="46"><use href="#owlmark"/></svg></div><div class="name">Startup<span>Sutra</span></div></div>
    <div class="rec"><span class="dot"></span>REC <span class="tc" id="tc">0:00</span></div>
  </div>

  <div class="hook" id="hook"><h1>Everyone says India can't make its own <span class="ac">chips.</span></h1></div>

  <div class="cardwrap" id="cardwrap">
    <div class="card" id="c1"></div><div class="card" id="c2"></div><div class="card" id="c3"></div><div class="card" id="c4"></div>
  </div>

  <div id="subs"><div class="sub-line" id="subline"></div></div>
  <div id="ftr"><div class="followpill">Follow @statupsutra</div></div>
</div>

<script>
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const p=(t,t0,d)=>clamp((t-t0)/d,0,1);
const easeOut=x=>1-Math.pow(1-x,3);
const $=id=>document.getElementById(id);
const ENV=window.ENV||[];
const envAt=t=>{ const f=t*30,i=Math.floor(f),a=ENV[i]||0,b=ENV[i+1]||a; return a+(b-a)*(f-i); };
const VARIANT=window.VARIANT||'screen';
(function(){const A=window.ACCENT; if(A){const r=document.documentElement.style;r.setProperty('--acc',A.acc);r.setProperty('--acc2',A.acc2);r.setProperty('--deep',A.deep);r.setProperty('--accrgb',A.accrgb);r.setProperty('--deeprgb',A.deeprgb);}if(window.HOOK_HTML){document.querySelector('.hook h1').innerHTML=window.HOOK_HTML;}})();
const LABEL=window.LABEL||'Growth Capital · #004';   // 'desk' | 'screen'

const CARDS=window.CARDS||[{id:'c1',s:6.5,e:12.5},{id:'c2',s:12.6,e:16.4},{id:'c3',s:16.5,e:22},{id:'c4',s:22.1,e:28.7}];
const HOOK=window.HOOK||{s:0.2,e:5.4};
const SUBS=window.SUBS||[];
const TOTAL=window.TOTAL||27.6;
const blinks=[2.6,7.4,12.1,17.3,22.6,26.4];
const subline=$('subline'); let lastIdx=-2;

const DATA=window.DATA||[
  {eb:'The Round', big:'<span class="num">₹107 Cr</span>', sub:'Series A, led by <b style="color:#f4f1ea;">Zoho</b>', ds:112, ss:50},
  {eb:'What They Build', big:'Edge-AI <span class="num">chips</span>', sub:'', ds:78, ss:38},
  {eb:'The Gap', big:'Imports <span class="num">nearly every chip</span>', sub:'', ds:66, ss:28},
  {eb:'The Thesis', big:'Fund the <span class="num">chip</span>, not the app', sub:'', ds:74, ss:32},
];
// fill desk cards
CARDS.forEach((c,i)=>{ const d=DATA[i]; $(c.id).innerHTML=
  `<div class="eyebrow"><span class="sq"></span>${d.eb}</div><div class="big" style="font-size:${d.ds}px;">${d.big}</div>`+
  (d.sub?`<div class="sub">${d.sub}</div>`:''); });

if(VARIANT==='screen'){ $('cardwrap').style.display='none'; }
$('scrline').innerHTML='<div class="b">'+LABEL+'</div>';

let scrIdx=-2;
window.seek=function(t){
  const e=envAt(t);
  // scene life: slow ken-burns + emphasis zoom
  const z=1.004+0.010*p(t,0,TOTAL)+0.004*Math.sin(t*0.7)+e*0.006;
  $('scene').style.transform=`scale(${z.toFixed(4)})`;

  // head nod / tilt (roll about neck) + emphasis lift
  const roll=1.1*Math.sin(t*0.6)+0.7*Math.sin(t*1.6+1)+e*1.7*Math.sin(t*2.8);
  const lift=-(e*3.2);
  $('headsprite').style.transform=`translateY(${lift.toFixed(2)}px) rotate(${roll.toFixed(2)}deg)`;

  // beak talking (bigger)
  const bk=$('beak'); bk.style.opacity=(Math.min(1,e*1.8)).toFixed(2);
  bk.style.transform=`scaleY(${(0.12+e*2.2).toFixed(3)})`;

  // blink
  let lid=0; for(const bt of blinks){ const d=t-bt; if(d>=0&&d<0.2){ lid=Math.sin((d/0.2)*Math.PI); break; } }
  $('lidL').style.opacity=(lid*0.96).toFixed(2); $('lidL').style.transform=`scaleY(${lid.toFixed(2)})`;
  $('lidR').style.opacity=(lid*0.96).toFixed(2); $('lidR').style.transform=`scaleY(${lid.toFixed(2)})`;

  $('tc').textContent='0:'+String(Math.floor(t)).padStart(2,'0');

  // hook
  const hk=$('hook'); const hi=easeOut(p(t,HOOK.s,0.5)),ho=1-p(t,HOOK.e-0.4,0.4);
  hk.style.opacity=(hi*ho).toFixed(3); hk.style.transform=`translateY(${((1-hi)*36).toFixed(1)}px)`;

  // current card index
  let curCard=-1; CARDS.forEach((c,i)=>{ if(t>=c.s-0.1&&t<=c.e+0.1) curCard=i; });

  if(VARIANT==='desk'){
    CARDS.forEach((c,i)=>{ const el=$(c.id); const fi=easeOut(p(t,c.s,0.36)),fo=1-p(t,c.e-0.32,0.32);
      const vis=(t>=c.s-0.1&&t<=c.e+0.1); el.style.opacity=vis?(fi*fo).toFixed(3):0;
      el.style.transform=`translateY(${((1-fi)*44).toFixed(1)}px) scale(${(0.96+0.04*fi).toFixed(3)})`; });
  } else {
    // data on the monitor
    const sl=$('scrline');
    if(curCard!==scrIdx){
      if(curCard>=0){ const d=DATA[curCard];
        sl.innerHTML=`<div class="eb">${d.eb}</div><div class="bg" style="font-size:${d.ss}px;">${d.big}</div>`+(d.sub?`<div class="sm">${d.sub}</div>`:'');
      } else { sl.innerHTML='<div class="b">'+LABEL+'</div>'; }
      scrIdx=curCard;
    }
  }

  // subtitles
  let cur=-1; for(let i=0;i<SUBS.length;i++){ const s=SUBS[i]; if(t>=s.s-0.15&&t<=s.e+0.25){cur=i;break;} }
  if(cur!==lastIdx){ if(cur>=0) subline.innerHTML=SUBS[cur].html; lastIdx=cur; }
  if(cur<0) subline.style.opacity=0;
  else { const s=SUBS[cur]; subline.style.opacity=clamp(p(t,s.s-0.08,0.2)*(1-p(t,s.e,0.22)),0,1).toFixed(3); }

  $('ftr').style.opacity=easeOut(p(t,TOTAL-3.5,0.5)).toFixed(3);
};
seek(0);
</script>
